[general]
live_config_reload = true

[window]
decorations = "Buttonless"
opacity = 0.8
blur = true
option_as_alt = "Both"
dynamic_title = true
dynamic_padding = true
padding = { x = 10, y = 10 }

[font]
size = 14
normal = { family = "D2KodingLigature Nerd Font Mono", style = "Regular" }
bold   = { family = "D2KodingLigature Nerd Font Mono", style = "Bold" }
italic = { family = "D2KodingLigature Nerd Font Mono", style = "Regular" }
bold_italic = { family = "D2KodingLigature Nerd Font Mono", style = "Bold" }

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true

[scrolling]
history = 100000
multiplier = 3

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true
